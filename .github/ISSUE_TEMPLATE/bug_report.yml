name: Bug 反馈
description: 功能异常、崩溃或界面问题；必须提供 LSPosed 日志，未提供不予处理。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**反馈必须提供 LSPosed 日志，未提供不予处理。截图、视频和适配报告不能代替 LSPosed 日志。**"
  - type: markdown
    attributes:
      value: 视频尽量压缩到 10MB 以内；上传失败时可以提供网盘链接。
  - type: markdown
    attributes:
      value: 请先搜索已有问题，截图或报告请脱敏；不要提交密码、令牌、聊天记录或备份包。
  - type: input
    id: nova_version
    attributes:
      label: Nova 版本
      placeholder: 例如 0.1.23（24）
    validations:
      required: true
  - type: input
    id: host_version
    attributes:
      label: 宿主名称、包名与版本
      placeholder: 例如 微信 / com.tencent.mm / 版本号及 versionCode；模块自身问题填写 Nova
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android、设备型号与 Xposed 框架版本
      placeholder: Android 版本 / 设备型号 / LSPosed 或所用框架的版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与相关功能开关
      description: 写清从哪个页面、开启哪些选项、执行哪些操作，以及出现频率。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期效果与实际表现
    validations:
      required: true
  - type: textarea
    id: lsposed_logs
    attributes:
      label: LSPosed 日志（必填，未提供不予处理）
      description: 复现问题后，从 LSPosed 管理器的日志页面导出日志，上传日志文件或提供可访问的下载链接；保留相关宿主进程和问题发生时段，并先移除私人信息。
      placeholder: 将导出的 LSPosed 日志文件拖到这里，或填写可访问的日志下载链接。填写“无”“稍后补充”或仅提供截图、视频均视为未提供日志，不予处理。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 脱敏截图或适配报告（可选）
      description: 仅提供与此问题直接相关且已移除私人信息的材料。
